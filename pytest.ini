[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
timeout = 180
markers =
    unit: pure Python, no browser, no subprocess
    browser: drives a throwaway headless Chromium against offline HTML fixtures
    cli: runs a script as a subprocess
    gas: runs the real facebook_sheet_receiver.gs under Node with an in-memory Sheet
    e2e: full offline workflow simulation
    live: touches the real browser on 127.0.0.1:9333 / real Facebook. Opt-in only: --run-live
